name: Daily AI Geek Pulse Digest

on:
  schedule:
    # 每天北京时间早上 08:00 (UTC 00:00) 自动抓取一手社区并用 DeepSeek 提纯
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动一键触发

permissions:
  contents: write

jobs:
  fetch-and-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DeepSeek Community Hunter Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fetch_and_digest.py

      - name: Commit and Push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.js data/feed.json
          git diff --staged --quiet || git commit -m "⚡ Auto-update AI Geek Pulse Feed"
          git push
