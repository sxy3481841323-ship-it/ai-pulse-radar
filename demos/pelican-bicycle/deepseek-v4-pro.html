<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican riding a bicycle · DeepSeek-V4-Pro</title>
<style>html,body{margin:0;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center}
svg{max-width:96vw;max-height:96vh;width:auto;height:auto}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#E8F4F8" />
  
  <!-- Ground Shadows -->
  <ellipse cx="400" cy="420" rx="220" ry="15" fill="#C5D8DF" opacity="0.7" />
  <ellipse cx="400" cy="420" rx="160" ry="8" fill="#A9C3CE" opacity="0.7" />

  <!-- Motion Lines -->
  <g stroke="#B0C4DE" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 20">
    <line x1="80" y1="300" x2="170" y2="300" />
    <line x1="50" y1="350" x2="160" y2="350" stroke-dasharray="15 25" />
    <line x1="100" y1="400" x2="190" y2="400" stroke-dasharray="5 15" />
  </g>

  <!-- Left Pedal & Crank (Background) -->
  <g id="left-pedal">
    <line x1="400" y1="350" x2="380" y2="320" stroke="#8D99AE" stroke-width="8" stroke-linecap="round" />
    <rect x="370" y="315" width="20" height="10" rx="3" fill="#1D3557" />
  </g>

  <!-- Left Leg (Background) -->
  <g id="left-leg">
    <path d="M 370,240 L 380,280 L 380,320" fill="none" stroke="#F77F00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="380" cy="280" r="6" fill="#F77F00" />
    <path d="M 380,320 L 365,335 L 380,340 L 385,335 Z" fill="#F77F00" />
  </g>

  <!-- Rear Wheel -->
  <g id="rear-wheel">
    <circle cx="250" cy="350" r="65" fill="none" stroke="#1D3557" stroke-width="12" />
    <circle cx="250" cy="350" r="59" fill="none" stroke="#A8DADC" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="#A8DADC" stroke-width="1.5" transform="translate(250, 350)">
      <line x1="0" y1="0" x2="0" y2="-59" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(30)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(60)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(90)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(120)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(150)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(180)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(210)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(240)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(270)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(300)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(330)" />
    </g>
    <circle cx="250" cy="350" r="8" fill="#8D99AE" />
  </g>

  <!-- Bicycle Frame -->
  <g id="bike-frame" stroke="#E63946" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Chainstay -->
    <line x1="250" y1="350" x2="400" y2="350" />
    <!-- Seat stay -->
    <line x1="380" y1="220" x2="250" y2="350" stroke-width="8" />
    <!-- Seat tube -->
    <line x1="400" y1="350" x2="380" y2="220" stroke-width="12" />
    <!-- Down tube -->
    <line x1="400" y1="350" x2="510" y2="220" stroke-width="12" />
    <!-- Top tube -->
    <line x1="380" y1="220" x2="510" y2="220" />
    <!-- Head tube -->
    <line x1="510" y1="220" x2="520" y2="250" stroke-width="12" />
    <!-- Fork -->
    <path d="M 520,250 L 560,350" stroke-width="8" />
  </g>

  <!-- Chain & Chainring -->
  <g id="drivetrain">
    <!-- Chain -->
    <line x1="250" y1="342" x2="400" y2="326" stroke="#1D3557" stroke-width="4" />
    <line x1="250" y1="358" x2="400" y2="374" stroke="#1D3557" stroke-width="4" />
    <line x1="250" y1="342" x2="400" y2="326" stroke="#8D99AE" stroke-width="2" stroke-dasharray="2 4" />
    <line x1="250" y1="358" x2="400" y2="374" stroke="#8D99AE" stroke-width="2" stroke-dasharray="2 4" />
    
    <!-- Chainring -->
    <circle cx="400" cy="350" r="24" fill="none" stroke="#1D3557" stroke-width="6" />
    <circle cx="400" cy="350" r="18" fill="none" stroke="#8D99AE" stroke-width="2" />
    <circle cx="400" cy="350" r="6" fill="#1D3557" />
  </g>

  <!-- Right Crank & Pedal (Foreground) -->
  <g id="right-pedal">
    <line x1="400" y1="350" x2="420" y2="380" stroke="#8D99AE" stroke-width="8" stroke-linecap="round" />
    <rect x="410" y="375" width="20" height="10" rx="3" fill="#1D3557" />
  </g>

  <!-- Pelican -->
  <g id="pelican">
    <!-- Tail -->
    <g fill="#FFF" stroke="#E0E5EC" stroke-width="2">
      <path d="M 310,210 L 260,200 Q 250,215 260,230 L 310,240 Z" />
    </g>
    <line x1="280" y1="205" x2="310" y2="220" stroke="#E0E5EC" stroke-width="2" />
    <line x1="270" y1="215" x2="310" y2="230" stroke="#E0E5EC" stroke-width="2" />

    <!-- Body -->
    <g fill="#FFF" stroke="#E0E5EC" stroke-width="2">
      <ellipse cx="360" cy="220" rx="60" ry="45" />
      <ellipse cx="420" cy="210" rx="35" ry="50" />
      <ellipse cx="380" cy="250" rx="45" ry="35" />
    </g>
    <!-- Belly Shadow -->
    <ellipse cx="380" cy="260" rx="35" ry="20" fill="#E0E5EC" opacity="0.5" />

    <!-- Right Leg (Foreground) -->
    <g id="right-leg">
      <path d="M 390,240 L 420,300 L 420,380" fill="none" stroke="#FCBF49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="420" cy="300" r="7" fill="#FCBF49" />
      <path d="M 420,380 L 400,395 L 415,405 L 425,400 L 435,405 L 445,390 Z" fill="#FCBF49" stroke="#F77F00" stroke-width="2" />
    </g>

    <!-- Neck & Head (Single Continuous Silhouette) -->
    <path d="M 420,210 C 450,160 460,110 490,95 C 505,85 510,70 495,60 C 485,55 475,60 470,70 C 450,110 430,160 400,210 Z" fill="#FFF" stroke="#E0E5EC" stroke-width="2" />

    <!-- Beak (Upper Mandible & Pouch) -->
    <g id="beak">
      <!-- Upper Beak -->
      <path d="M 495,65 L 600,90 L 608,92 L 600,100 L 490,95 Z" fill="#FF9F1C" stroke="#F77F00" stroke-width="2" stroke-linejoin="round" />
      <!-- Pouch -->
      <path d="M 490,95 C 520,170 590,130 600,100 Q 550,110 490,95 Z" fill="#FFBF69" stroke="#F77F00" stroke-width="2" stroke-linejoin="round" />
      <!-- Pouch Details -->
      <path d="M 500,105 C 530,150 570,125 580,100" fill="none" stroke="#FFA726" stroke-width="3" stroke-linecap="round" />
      <path d="M 510,120 Q 520,135 530,140" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" />
      <path d="M 530,110 Q 540,125 550,130" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Eye -->
    <circle cx="485" cy="75" r="4" fill="#1D3557" />
    <circle cx="486" cy="74" r="1.5" fill="#FFF" />
    <!-- Eyebrow -->
    <path d="M 480,65 Q 488,60 496,68" fill="none" stroke="#1D3557" stroke-width="3" stroke-linecap="round" />

    <!-- Wing (Extended to Handlebars) -->
    <g id="wing">
      <!-- Main Wing Structure -->
      <path d="M 380,230 C 430,260 500,220 540,195 C 550,190 550,205 540,210 C 500,230 430,270 380,250 Z" fill="#FFF" stroke="#E0E5EC" stroke-width="2" />
      <!-- Black Primary Feathers -->
      <path d="M 520,195 L 560,190 L 545,215 Z" fill="#333" />
      <!-- Feather details -->
      <path d="M 500,198 L 520,213 M 480,205 L 500,218 M 450,212 L 470,225 M 420,222 L 440,235" stroke="#D3D3D3" fill="none" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Front Wheel -->
  <g id="front-wheel">
    <circle cx="560" cy="350" r="65" fill="none" stroke="#1D3557" stroke-width="12" />
    <circle cx="560" cy="350" r="59" fill="none" stroke="#A8DADC" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="#A8DADC" stroke-width="1.5" transform="translate(560, 350)">
      <line x1="0" y1="0" x2="0" y2="-59" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(30)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(60)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(90)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(120)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(150)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(180)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(210)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(240)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(270)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(300)" />
      <line x1="0" y1="0" x2="0" y2="-59" transform="rotate(330)" />
    </g>
    <circle cx="560" cy="350" r="8" fill="#8D99AE" />
  </g>

  <!-- Handlebars & Seat -->
  <g id="controls">
    <!-- Stem -->
    <line x1="510" y1="220" x2="520" y2="190" stroke="#8D99AE" stroke-width="8" stroke-linecap="round" />
    <!-- Handlebar Drop Bar -->
    <path d="M 520,190 Q 540,180 550,200 Q 555,210 545,210" fill="none" stroke="#1D3557" stroke-width="6" stroke-linecap="round" />
    <!-- Brake Lever -->
    <line x1="545" y1="203" x2="535" y2="193" stroke="#8D99AE" stroke-width="4" stroke-linecap="round" />
    <!-- Bell -->
    <circle cx="525" cy="183" r="6" fill="#F4A261" />
    <path d="M 525,183 L 525,177" stroke="#F4A261" stroke-width="2" stroke-linecap="round" />

    <!-- Seatpost -->
    <line x1="380" y1="220" x2="375" y2="195" stroke="#8D99AE" stroke-width="8" stroke-linecap="round" />
    <!-- Saddle -->
    <path d="M 355,195 Q 375,190 395,195 Q 400,195 395,200 L 360,200 Z" fill="#1D3557" />
  </g>
</svg>
</body></html>
