<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican riding a bicycle · DeepSeek-V4.1-Flash</title>
<style>html,body{margin:0;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center}
svg{max-width:96vw;max-height:96vh;width:auto;height:auto}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0fbfc" />
      <stop offset="100%" stop-color="#98c1d9" />
    </linearGradient>
    
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="680" cy="100" r="50" fill="url(#sunGrad)" />
  <circle cx="680" cy="100" r="70" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="10 15" opacity="0.6" />

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.8">
    <path d="M 100 150 Q 120 120 150 150 Q 180 130 200 160 Q 220 180 190 190 L 100 190 Q 80 180 100 150 Z" />
    <path d="M 600 200 Q 620 170 650 200 Q 680 180 700 210 Q 720 230 690 240 L 600 240 Q 580 230 600 200 Z" />
    <path d="M 300 100 Q 315 80 335 100 Q 355 85 370 105 Q 385 120 360 125 L 300 125 Q 285 115 300 100 Z" opacity="0.5" />
  </g>

  <!-- Ground / Road -->
  <path d="M 0 520 L 800 520 L 800 600 L 0 600 Z" fill="#4a4e69" />
  <line x1="50" y1="560" x2="150" y2="560" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" opacity="0.5" />
  <line x1="250" y1="560" x2="350" y2="560" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" opacity="0.5" />
  <line x1="450" y1="560" x2="550" y2="560" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" opacity="0.5" />
  <line x1="650" y1="560" x2="750" y2="560" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 20" opacity="0.5" />

  <!-- Bike Shadow -->
  <ellipse cx="400" cy="530" rx="250" ry="20" fill="#2b2d42" opacity="0.3" />

  <!-- Motion Lines -->
  <g stroke="#8d99ae" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M 120 400 L 60 400" />
    <path d="M 140 430 L 80 430" />
    <path d="M 100 460 L 40 460" />
    <path d="M 130 490 L 70 490" />
  </g>

  <!-- ================= BICYCLE ================= -->
  
  <!-- Bicycle Back Wheel -->
  <g id="back-wheel">
    <circle cx="250" cy="450" r="80" fill="none" stroke="#2b2d42" stroke-width="16" />
    <circle cx="250" cy="450" r="80" fill="none" stroke="#8d99ae" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="#8d99ae" stroke-width="2">
      <line x1="250" y1="370" x2="250" y2="530" />
      <line x1="170" y1="450" x2="330" y2="450" />
      <line x1="193" y1="393" x2="307" y2="507" />
      <line x1="193" y1="507" x2="307" y2="393" />
      <line x1="220" y1="375" x2="280" y2="525" />
      <line x1="280" y1="375" x2="220" y2="525" />
      <line x1="175" y1="420" x2="325" y2="480" />
      <line x1="175" y1="480" x2="325" y2="420" />
    </g>
    <circle cx="250" cy="450" r="12" fill="#2b2d42" />
  </g>

  <!-- Bicycle Front Wheel -->
  <g id="front-wheel">
    <circle cx="550" cy="450" r="80" fill="none" stroke="#2b2d42" stroke-width="16" />
    <circle cx="550" cy="450" r="80" fill="none" stroke="#8d99ae" stroke-width="4" />
    <!-- Spokes -->
    <g stroke="#8d99ae" stroke-width="2">
      <line x1="550" y1="370" x2="550" y2="530" />
      <line x1="470" y1="450" x2="630" y2="450" />
      <line x1="493" y1="393" x2="607" y2="507" />
      <line x1="493" y1="507" x2="607" y2="393" />
      <line x1="520" y1="375" x2="580" y2="525" />
      <line x1="580" y1="375" x2="520" y2="525" />
      <line x1="475" y1="420" x2="625" y2="480" />
      <line x1="475" y1="480" x2="625" y2="420" />
    </g>
    <circle cx="550" cy="450" r="12" fill="#2b2d42" />
  </g>

  <!-- Bicycle Frame -->
  <g id="frame" stroke="#2a9d8f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chainstay -->
    <line x1="250" y1="450" x2="400" y2="450" />
    <!-- Seatstay -->
    <line x1="250" y1="450" x2="350" y2="300" />
    <!-- Seat tube -->
    <line x1="350" y1="300" x2="400" y2="450" />
    <!-- Downtube -->
    <line x1="400" y1="450" x2="520" y2="300" />
    <!-- Top tube -->
    <line x1="350" y1="300" x2="520" y2="300" />
    <!-- Fork -->
    <line x1="520" y1="300" x2="550" y2="450" />
  </g>

  <!-- Bike Chain -->
  <g id="chain" stroke="#2b2d42" stroke-width="4" stroke-dasharray="3 3" fill="none">
    <path d="M 400 465 L 250 455" />
    <path d="M 400 435 L 250 445" />
  </g>

  <!-- Chainring and Pedals -->
  <g id="crankset">
    <!-- Chainring -->
    <circle cx="400" cy="450" r="30" fill="#2b2d42" />
    <circle cx="400" cy="450" r="20" fill="#8d99ae" />
    <circle cx="400" cy="450" r="10" fill="#2b2d42" />
    <!-- Cranks -->
    <line x1="400" y1="450" x2="380" y2="490" stroke="#8d99ae" stroke-width="8" stroke-linecap="round" />
    <line x1="400" y1="450" x2="420" y2="410" stroke="#8d99ae" stroke-width="8" stroke-linecap="round" />
    <!-- Pedals -->
    <rect x="360" y="485" width="40" height="10" rx="4" fill="#2b2d42" />
    <rect x="400" y="405" width="40" height="10" rx="4" fill="#2b2d42" />
  </g>

  <!-- Bicycle Seat -->
  <g id="seat">
    <path d="M 320 300 Q 350 280 380 300 L 360 310 Q 340 305 320 300 Z" fill="#2b2d42" />
    <line x1="350" y1="300" x2="350" y2="320" stroke="#8d99ae" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Bicycle Handlebars -->
  <g id="handlebars">
    <!-- Stem -->
    <line x1="520" y1="300" x2="520" y2="270" stroke="#8d99ae" stroke-width="8" stroke-linecap="round" />
    <!-- Handlebar -->
    <path d="M 520 270 Q 550 260 560 290 Q 540 300 520 290" fill="none" stroke="#2b2d42" stroke-width="10" stroke-linecap="round" />
    <!-- Grip -->
    <line x1="545" y1="282" x2="560" y2="292" stroke="#2b2d42" stroke-width="12" stroke-linecap="round" />
    <!-- Bell -->
    <circle cx="530" cy="275" r="8" fill="#ffd166" stroke="#2b2d42" stroke-width="2" />
    <path d="M 530 283 L 530 290" stroke="#2b2d42" stroke-width="3" />
  </g>

  <!-- ================= PELICAN ================= -->

  <!-- Pelican Back Leg (Background) -->
  <g id="back-leg">
    <path d="M 370 270 L 390 380 L 420 410" fill="none" stroke="#e76f51" stroke-width="10" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 415 410 Q 410 425 395 430 Q 405 435 415 430 Q 415 440 425 435 Q 430 440 440 430 Q 430 420 425 410 Z" fill="#e76f51" stroke="#2b2d42" stroke-width="3" />
  </g>

  <!-- Pelican Back Wing -->
  <g id="back-wing">
    <path d="M 350 220 Q 320 260 340 290 Q 360 270 380 240 Z" fill="#edf2f4" stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Pelican Body -->
  <g id="pelican-body" filter="url(#shadow)">
    <ellipse cx="400" cy="230" rx="85" ry="65" fill="#ffffff" stroke="#2b2d42" stroke-width="4" />
    <!-- Belly shading -->
    <path d="M 330 250 Q 400 310 470 250" fill="none" stroke="#e0e1dd" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Pelican Neck and Head -->
  <g id="pelican-head-neck">
    <!-- Neck -->
    <path d="M 440 200 Q 480 140 460 80" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" />
    <path d="M 440 200 Q 480 140 460 80" fill="none" stroke="#2b2d42" stroke-width="4" stroke-linecap="round" transform="translate(0, 18)" />
    <!-- Head -->
    <circle cx="460" cy="80" r="28" fill="#ffffff" stroke="#2b2d42" stroke-width="4" />
  </g>

  <!-- Pelican Beak and Pouch -->
  <g id="pelican-beak">
    <!-- Upper Beak -->
    <path d="M 480 70 L 585 80 Q 595 80 590 90 Q 585 85 580 85 L 480 85 Z" fill="#f4a261" stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" />
    <!-- Pouch (Lower Beak) -->
    <path d="M 475 85 Q 520 170 590 90 Q 550 140 475 100 Z" fill="#e76f51" stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" />
    <!-- Beak Line -->
    <path d="M 480 85 L 580 85" fill="none" stroke="#2b2d42" stroke-width="3" />
  </g>

  <!-- Pelican Eye -->
  <g id="pelican-eye">
    <circle cx="470" cy="75" r="6" fill="#2b2d42" />
    <circle cx="472" cy="73" r="2.5" fill="#ffffff" />
  </g>

  <!-- Pelican Helmet -->
  <g id="helmet">
    <!-- Helmet Dome -->
    <path d="M 432 80 Q 460 40 488 80 A 28 28 0 0 1 432 80 Z" fill="#e63946" stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" />
    <!-- Helmet Stripe -->
    <path d="M 440 60 Q 460 50 480 60" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <!-- Helmet Strap -->
    <path d="M 438 85 L 450 110" fill="none" stroke="#2b2d42" stroke-width="3" />
    <!-- Helmet Visor -->
    <path d="M 480 75 L 495 80 L 485 85 Z" fill="#2b2d42" />
  </g>

  <!-- Pelican Front Wing (Reaching Handlebar) -->
  <g id="front-wing">
    <path d="M 430 210 Q 490 220 545 285 Q 520 300 480 250 Q 450 230 420 225 Z" fill="#edf2f4" stroke="#2b2d42" stroke-width="4" stroke-linejoin="round" />
    <!-- Wing Feathers Details -->
    <path d="M 460 230 Q 490 250 520 275" fill="none" stroke="#2b2d42" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 450 240 Q 480 260 505 280" fill="none" stroke="#2b2d42" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Pelican Front Leg (Foreground) -->
  <g id="front-leg">
    <path d="M 410 280 L 400 400 L 380 490" fill="none" stroke="#f4a261" stroke-width="12" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 375 480 Q 370 495 355 500 Q 365 505 375 500 Q 375 510 385 505 Q 390 510 400 500 Q 390 490 385 480 Z" fill="#f4a261" stroke="#2b2d42" stroke-width="3" />
  </g>

</svg>
</body></html>
