<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pseudo 3D Racer</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070d;
    overflow: hidden;
    font-family: monospace;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 80px rgba(60, 180, 255, 0.25), 0 0 0 1px rgba(120, 200, 255, 0.15);
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function () {
'use strict';

/* ============================================================
   基础设置
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width = 1280, height = 720, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  let w = availW, h = w * 9 / 16;
  if (h > availH) { h = availH; w = h * 16 / 9; }
  width = Math.max(320, Math.floor(w));
  height = Math.floor(width * 9 / 16);
  canvas.width = Math.floor(width * DPR);
  canvas.height = Math.floor(height * DPR);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ============================================================
   工具
   ============================================================ */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;

function increase(start, inc, max) {
  let r = start + inc;
  while (r >= max) r -= max;
  while (r < 0) r += max;
  return r;
}
function easeIn(a, b, p) { return a + (b - a) * p * p; }
function easeInOut(a, b, p) { return a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5); }
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function hex2rgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixRGB(c1, c2, t) {
  return [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
}
function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

/* ============================================================
   常量
   ============================================================ */
const segmentLength = 200;
const rumbleLength = 3;
const roadWidth = 2000;
const lanes = 3;
const cameraHeight = 1000;
const fieldOfView = 100;
const cameraDepth = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);
const drawDistance = 250;
const playerZ = cameraHeight * cameraDepth;
const fogDensity = 4;

const maxSpeed = segmentLength * 60;
const accel = maxSpeed / 5;
const braking = -maxSpeed / 1.6;
const decel = -maxSpeed / 6;
const offRoadDecel = -maxSpeed / 2;
const offRoadLimit = maxSpeed / 4;
const centrifugal = 0.32;

const ROAD = {
  LENGTH: { NONE: 0, SHORT: 25, MEDIUM: 50, LONG: 100 },
  HILL:   { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 },
  CURVE:  { NONE: 0, EASY: 2, MEDIUM: 4, HARD: 6 }
};

/* ============================================================
   颜色 & 雾调色板
   ============================================================ */
const FOG_RGB = hex2rgb('#a9d6ef');

const LIGHT_RGB = {
  road:   hex2rgb('#55555f'),
  grass:  hex2rgb('#3fae52'),
  rumble: hex2rgb('#ffffff'),
  lane:   hex2rgb('#f2f2f2')
};
const DARK_RGB = {
  road:   hex2rgb('#4b4b57'),
  grass:  hex2rgb('#349a46'),
  rumble: hex2rgb('#d02b2b'),
  lane:   null
};

const palette = [];
(function buildPalette() {
  for (let n = 0; n < drawDistance; n++) {
    const d = n / drawDistance;
    const vis = 1 / Math.pow(Math.E, d * d * fogDensity);
    const t = 1 - vis;
    const mk = (src) => ({
      road:   css(mixRGB(src.road, FOG_RGB, t)),
      grass:  css(mixRGB(src.grass, FOG_RGB, t)),
      rumble: css(mixRGB(src.rumble, FOG_RGB, t)),
      lane:   src.lane ? css(mixRGB(src.lane, FOG_RGB, t)) : null
    });
    palette.push({ light: mk(LIGHT_RGB), dark: mk(DARK_RGB) });
  }
})();

/* ============================================================
   赛道
   ============================================================ */
const segments = [];

function lastY() {
  return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y;
}

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n,
    p1: { world: { y: lastY(), z: n * segmentLength }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * segmentLength }, camera: {}, screen: {} },
    curve: curve,
    dark: (Math.floor(n / rumbleLength) % 2) === 1,
    sprites: [],
    cars: [],
    clip: 0,
    visible: false
  });
}

function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY();
  const endY = startY + (y || 0) * segmentLength;
  const total = enter + hold + leave;
  let n;
  for (n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (n = 0; n < hold; n++)  addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}

function addStraight(num) { num = num || ROAD.LENGTH.MEDIUM; addRoad(num, num, num, 0, 0); }
function addHill(num, h) { num = num || ROAD.LENGTH.MEDIUM; addRoad(num, num, num, 0, h || ROAD.HILL.MEDIUM); }
function addCurve(num, curve, h) { addRoad(num, num, num, curve, h || 0); }

function addLowRollingHills(num, h) {
  num = num || ROAD.LENGTH.SHORT; h = h || ROAD.HILL.LOW;
  addRoad(num, num, num, 0, h / 2);
  addRoad(num, num, num, 0, -h);
  addRoad(num, num, num, ROAD.CURVE.EASY, h);
  addRoad(num, num, num, 0, 0);
  addRoad(num, num, num, -ROAD.CURVE.EASY, h / 2);
  addRoad(num, num, num, 0, 0);
}

function addSCurves() {
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, 0);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.CURVE.EASY, -ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY, ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
}

function addBumps() {
  addRoad(10, 10, 10, 0, 5);
  addRoad(10, 10, 10, 0, -2);
  addRoad(10, 10, 10, 0, -5);
  addRoad(10, 10, 10, 0, 8);
  addRoad(10, 10, 10, 0, 5);
  addRoad(10, 10, 10, 0, -7);
  addRoad(10, 10, 10, 0, 5);
  addRoad(10, 10, 10, 0, -2);
}

function addDownhillToEnd(num) {
  num = num || 200;
  addRoad(num, num, num, -ROAD.CURVE.EASY, -lastY() / segmentLength);
}

let trackLength = 0;

function buildTrack() {
  segments.length = 0;

  addStraight(ROAD.LENGTH.SHORT);
  addLowRollingHills();
  addSCurves();
  addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
  addBumps();
  addLowRollingHills();
  addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
  addStraight();
  addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
  addSCurves();
  addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
  addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
  addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, -ROAD.HILL.LOW);
  addBumps();
  addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
  addStraight();
  addSCurves();
  addDownhillToEnd();

  trackLength = segments.length * segmentLength;
  addScenery();
}

/* ============================================================
   路边景物绘制
   ============================================================ */
function drawTree(x, y, w, h) {
  ctx.fillStyle = '#3b2a17';
  ctx.fillRect(x - w * 0.05, y - h * 0.18, w * 0.1, h * 0.18);

  const g1 = '#1f7a34', g2 = '#2a9142';
  for (let i = 0; i < 3; i++) {
    const base = y - h * (0.15 + 0.19 * i);
    const hw = w * (0.5 - 0.13 * i);
    const top = base - h * 0.42;
    ctx.fillStyle = (i % 2) ? g1 : g2;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x - hw, base);
    ctx.lineTo(x + hw, base);
    ctx.closePath();
    ctx.fill();
  }
}

function drawBush(x, y, w, h) {
  ctx.fillStyle = '#2b8c3e';
  ctx.beginPath();
  ctx.ellipse(x, y - h * 0.4, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#35a44b';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.15, y - h * 0.55, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBillboard(x, y, w, h) {
  ctx.fillStyle = '#8a8a8a';
  ctx.fillRect(x - w * 0.04, y - h * 0.72, w * 0.08, h * 0.72);
  ctx.fillStyle = '#123a6b';
  ctx.fillRect(x - w * 0.5, y - h, w, h * 0.34);
  ctx.fillStyle = '#ffd34d';
  ctx.fillRect(x - w * 0.44, y - h * 0.955, w * 0.88, h * 0.08);
  ctx.fillStyle = '#e64a3a';
  ctx.fillRect(x - w * 0.44, y - h * 0.83, w * 0.55, h * 0.07);
  ctx.fillStyle = '#7ad3ff';
  ctx.fillRect(x - w * 0.44, y - h * 0.73, w * 0.7, h * 0.04);
}

function drawPost(x, y, w, h) {
  ctx.fillStyle = '#efefef';
  ctx.fillRect(x - w * 0.5, y - h, w, h);
  ctx.fillStyle = '#e02b2b';
  ctx.fillRect(x - w * 0.5, y - h, w, h * 0.35);
}

function addScenery() {
  const n = segments.length;
  for (let i = 0; i < n; i++) {
    const r1 = rnd(i);
    const r2 = rnd(i + 997);
    const r3 = rnd(i + 3313);
    const seg = segments[i];

    // 树木
    if (i > 25 && i % 3 === 0 && r1 < 0.5) {
      const side = r2 < 0.5 ? -1 : 1;
      const off = side * (1.4 + r1 * 3.0);
      const sc = 0.75 + r3 * 0.7;
      seg.sprites.push({
        offset: off,
        sprite: { w: 1500 * sc, h: 2600 * sc, draw: drawTree }
      });
    }
    // 灌木
    if (i > 25 && i % 6 === 0 && r2 < 0.55) {
      const side = r3 < 0.5 ? -1 : 1;
      seg.sprites.push({
        offset: side * (1.18 + r2 * 0.6),
        sprite: { w: 700, h: 500, draw: drawBush }
      });
    }
    // 广告牌
    if (i % 71 === 37) {
      seg.sprites.push({
        offset: 1.32,
        sprite: { w: 1500, h: 1900, draw: drawBillboard }
      });
    }
    // 路标杆
    if (i % 5 === 0) {
      seg.sprites.push({ offset: -1.1, sprite: { w: 130, h: 620, draw: drawPost } });
      seg.sprites.push({ offset:  1.1, sprite: { w: 130, h: 620, draw: drawPost } });
    }
  }
}

/* ============================================================
   车辆
   ============================================================ */
const cars = [];
const CAR_COLORS = ['#e04a3a', '#3a8fe0', '#f0c020', '#30c07a', '#c04ad0', '#e8e8e8'];

function resetCars() {
  cars.length = 0;
  const count = 26;
  for (let i = 0; i < count; i++) {
    const oncoming = Math.random() < 0.65;
    const z = Math.random() * trackLength;
    const offset = oncoming
      ? -(0.16 + Math.random() * 0.52)
      : (0.16 + Math.random() * 0.52);
    const spd = oncoming
      ? -(maxSpeed * (0.18 + Math.random() * 0.28))
      : (maxSpeed * (0.12 + Math.random() * 0.22));
    cars.push({
      z: z,
      offset: offset,
      speed: spd,
      color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]
    });
  }
}

function updateCars(dt) {
  for (let i = 0; i < segments.length; i++) {
    if (segments[i].cars.length) segments[i].cars.length = 0;
  }
  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    car.z = increase(car.z, car.speed * dt, trackLength);
    const seg = findSegment(car.z);
    seg.cars.push(car);
  }
}

function drawCarBody(x, y, w, h, color) {
  if (w < 1.2) return;

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.55, h * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#141414';
  ctx.fillRect(x - w * 0.52, y - h * 0.40, w * 0.16, h * 0.40);
  ctx.fillRect(x + w * 0.36, y - h * 0.40, w * 0.16, h * 0.40);

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.50, y - h * 0.08);
  ctx.lineTo(x - w * 0.46, y - h * 0.55);
  ctx.lineTo(x - w * 0.26, y - h * 0.90);
  ctx.lineTo(x + w * 0.26, y - h * 0.90);
  ctx.lineTo(x + w * 0.46, y - h * 0.55);
  ctx.lineTo(x + w * 0.50, y - h * 0.08);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(170,215,250,0.9)';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.22, y - h * 0.86);
  ctx.lineTo(x + w * 0.22, y - h * 0.86);
  ctx.lineTo(x + w * 0.30, y - h * 0.58);
  ctx.lineTo(x - w * 0.30, y - h * 0.58);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x - w * 0.46, y - h * 0.55, w * 0.92, h * 0.05);
}

/* ============================================================
   投影与渲染
   ============================================================ */
function project(p, cameraX, cameraY, cameraZ) {
  p.camera.x = (p.world.x || 0) - cameraX;
  p.camera.y = (p.world.y || 0) - cameraY;
  p.camera.z = (p.world.z || 0) - cameraZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round(width / 2 + p.screen.scale * p.camera.x * width / 2);
  p.screen.y = Math.round(height / 2 - p.screen.scale * p.camera.y * height / 2);
  p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
}

function findSegment(z) {
  let idx = Math.floor(z / segmentLength) % segments.length;
  if (idx < 0) idx += segments.length;
  return segments[idx];
}

function poly(x1, y1, x2, y2, x3, y3, x4, y4) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}

function renderSegment(x1, y1, w1, x2, y2, w2, col) {
  const r1 = w1 / 6, r2 = w2 / 6;
  const l1 = w1 / 32, l2 = w2 / 32;

  ctx.fillStyle = col.grass;
  ctx.fillRect(0, y2, width, (y1 - y2) + 1);

  ctx.fillStyle = col.rumble;
  poly(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2);
  poly(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2);

  ctx.fillStyle = col.road;
  poly(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2);

  if (col.lane) {
    ctx.fillStyle = col.lane;
    let lw1 = w1 * 2 / lanes, lw2 = w2 * 2 / lanes;
    let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
    for (let l = 1; l < lanes; l++, lx1 += lw1, lx2 += lw2) {
      poly(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2);
    }
  }
}

/* ---------- 背景 ---------- */
function drawMountains(hz) {
  const period = Math.max(width * 0.62, 420);
  const mh = height * 0.27;
  const off = ((position * 0.012) % period + period) % period;

  ctx.fillStyle = '#2d5680';
  ctx.beginPath();
  ctx.moveTo(-period * 2, hz + 2);
  for (let px = -period * 2 - off; px < width + period; px += period) {
    ctx.lineTo(px + period * 0.10, hz - mh * 0.48);
    ctx.lineTo(px + period * 0.22, hz - mh * 0.16);
    ctx.lineTo(px + period * 0.40, hz - mh * 0.88);
    ctx.lineTo(px + period * 0.55, hz - mh * 0.36);
    ctx.lineTo(px + period * 0.72, hz - mh * 0.68);
    ctx.lineTo(px + period * 0.88, hz - mh * 0.22);
    ctx.lineTo(px + period * 1.00, hz + 2);
  }
  ctx.lineTo(width + period * 2, hz + 2);
  ctx.lineTo(width + period * 2, height);
  ctx.lineTo(-period * 2, height);
  ctx.closePath();
  ctx.fill();
}

function drawBackground() {
  const hz = height / 2;

  const sky = ctx.createLinearGradient(0, 0, 0, hz + height * 0.12);
  sky.addColorStop(0, '#0d2447');
  sky.addColorStop(0.42, '#3a72b8');
  sky.addColorStop(0.78, '#8dc2e8');
  sky.addColorStop(1, '#cbe6f6');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);

  const sunX = width * 0.74;
  const sunY = hz * 0.62;
  const rad = height * 0.24;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, rad);
  sg.addColorStop(0, 'rgba(255,246,200,0.95)');
  sg.addColorStop(0.18, 'rgba(255,226,150,0.7)');
  sg.addColorStop(0.5, 'rgba(255,190,110,0.22)');
  sg.addColorStop(1, 'rgba(255,170,90,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(sunX, sunY, rad, 0, Math.PI * 2);
  ctx.fill();

  drawMountains(hz);

  const gg = ctx.createLinearGradient(0, hz, 0, height);
  gg.addColorStop(0, '#a9d6ef');
  gg.addColorStop(0.10, '#4e9e5c');
  gg.addColorStop(1, '#2f8f3c');
  ctx.fillStyle = gg;
  ctx.fillRect(0, hz, width, height - hz);
}

/* ---------- 精灵 ---------- */
function drawSpriteAt(sprite, sx, sy, unit, clipY) {
  const w = sprite.w * unit;
  const h = sprite.h * unit;
  if (w < 1 || h < 1) return;
  if (sy - h > height || sy < 0) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, width, Math.max(0, clipY));
  ctx.clip();
  sprite.draw(sx, sy, w, h);
  ctx.restore();
}

/* ============================================================
   游戏状态
   ============================================================ */
let position = 0;
let playerX = 0;
let speed = 0;
let score = 0;
let crashed = false;

const keys = { left: false, right: false, up: false, down: false };

/* ============================================================
   更新
   ============================================================ */
function checkCollision() {
  const pz = position + playerZ;
  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    let dz = car.z - pz;
    if (dz > trackLength / 2) dz -= trackLength;
    if (dz < -trackLength / 2) dz += trackLength;
    if (Math.abs(dz) < 820 && Math.abs(playerX - car.offset) < 0.36) return true;
  }
  return false;
}

function update(dt) {
  const playerSegment = findSegment(position + playerZ);
  const speedPercent = speed / maxSpeed;
  const dx = dt * 2.2 * speedPercent;

  if (keys.left) playerX -= dx;
  if (keys.right) playerX += dx;

  playerX -= dx * speedPercent * playerSegment.curve * centrifugal;

  if (keys.up) speed += accel * dt;
  else if (keys.down) speed += braking * dt;
  else speed += decel * dt;

  if ((playerX < -1 || playerX > 1) && speed > offRoadLimit) {
    speed += offRoadDecel * dt;
  }

  playerX = clamp(playerX, -2.4, 2.4);
  speed = clamp(speed, 0, maxSpeed);

  updateCars(dt);

  position = increase(position, speed * dt, trackLength);

  score += speed * dt * 0.0006;

  if (checkCollision()) {
    crashed = true;
    speed = 0;
  }
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  const baseSegment = findSegment(position);
  const basePercent = (position % segmentLength) / segmentLength;
  const playerSegment = findSegment(position + playerZ);
  const playerPercent = ((position + playerZ) % segmentLength) / segmentLength;
  const playerY = lerp(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);

  let maxy = height;
  let x = 0;
  let dx = -(baseSegment.curve * basePercent);

  drawBackground();

  // ---- 道路 ----
  for (let n = 0; n < drawDistance; n++) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    seg.looped = seg.index < baseSegment.index;
    seg.clip = maxy;
    seg.visible = false;

    const camZ = position - (seg.looped ? trackLength : 0);

    project(seg.p1, playerX * roadWidth - x, playerY + cameraHeight, camZ);
    project(seg.p2, playerX * roadWidth - x - dx, playerY + cameraHeight, camZ);

    x += dx;
    dx += seg.curve;

    if (seg.p1.camera.z <= cameraDepth) continue;
    if (seg.p2.screen.y >= seg.p1.screen.y) continue;
    if (seg.p2.screen.y >= maxy) continue;

    const pal = palette[n][seg.dark ? 'dark' : 'light'];
    renderSegment(
      seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w,
      seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w,
      pal
    );

    seg.visible = true;
    maxy = seg.p2.screen.y;
  }

  // ---- 精灵与车辆（由远及近）----
  for (let n = drawDistance - 1; n > 0; n--) {
    const seg = segments[(baseSegment.index + n) % segments.length];
    if (!seg.visible) continue;

    const p1 = seg.p1.screen;
    const p2 = seg.p2.screen;
    const clipY = seg.clip;

    // 车辆
    for (let i = 0; i < seg.cars.length; i++) {
      const car = seg.cars[i];
      const pct = (car.z % segmentLength) / segmentLength;
      const sx = lerp(p1.x, p2.x, pct);
      const sy = lerp(p1.y, p2.y, pct);
      const sw = lerp(p1.w, p2.w, pct);
      const unit = sw / roadWidth;
      const cx = sx + car.offset * sw;
      const cw = 900 * unit;
      const ch = 720 * unit;
      if (cw < 1.2) continue;

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, width, Math.max(0, clipY));
      ctx.clip();
      drawCarBody(cx, sy, cw, ch, car.color);
      ctx.restore();
    }

    // 景物
    for (let i = 0; i < seg.sprites.length; i++) {
      const sp = seg.sprites[i];
      const unit = p1.w / roadWidth;
      const sx = p1.x + sp.offset * p1.w;
      drawSpriteAt(sp.sprite, sx, p1.y, unit, clipY);
    }
  }

  drawHUD();
}

/* ============================================================
   HUD
   ============================================================ */
function drawHUD() {
  const s = height / 540;

  // ---- 速度表 ----
  const cx = width - 92 * s;
  const cy = height - 82 * s;
  const r = 60 * s;
  const a0 = Math.PI * 0.75;
  const a1 = Math.PI * 2.25;
  const t = clamp(speed / maxSpeed, 0, 1);

  ctx.save();
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a1);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 13 * s;
  ctx.stroke();

  const grad = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
  grad.addColorStop(0, '#25e6ff');
  grad.addColorStop(0.65, '#5cff9d');
  grad.addColorStop(1, '#ff4d4d');
  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * t);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 9 * s;
  ctx.stroke();

  // 刻度
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2 * s;
  for (let i = 0; i <= 8; i++) {
    const a = a0 + (a1 - a0) * (i / 8);
    const inner = r - 17 * s, outer = r - 9 * s;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
    ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
    ctx.stroke();
  }

  // 指针
  const ang = a0 + (a1 - a0) * t;
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(ang) * 8 * s, cy - Math.sin(ang) * 8 * s);
  ctx.lineTo(cx + Math.cos(ang) * (r - 20 * s), cy + Math.sin(ang) * (r - 20 * s));
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3 * s;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 5 * s, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // 数字
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.round(18 * s) + 'px monospace';
  ctx.fillText(Math.round(t * 280), cx, cy + 26 * s);
  ctx.font = Math.round(10 * s) + 'px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('KM/H', cx, cy + 44 * s);

  ctx.restore();

  // ---- 分数 ----
  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 8 * s;

  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = 'bold ' + Math.round(24 * s) + 'px monospace';
  ctx.fillText('SCORE ' + String(Math.floor(score)).padStart(6, '0'), 20 * s, 18 * s);

  ctx.fillStyle = 'rgba(160,235,255,0.9)';
  ctx.font = 'bold ' + Math.round(15 * s) + 'px monospace';
  ctx.fillText('← → 转向    ↑ 加速    ↓ 刹车', 20 * s, 50 * s);

  ctx.restore();

  // ---- 撞车提示 ----
  if (crashed) {
    ctx.save();
    ctx.fillStyle = 'rgba(3,8,18,0.62)';
    ctx.fillRect(0, 0, width, height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,60,60,0.85)';
    ctx.shadowBlur = 24 * s;

    ctx.fillStyle = '#ff4b4b';
    ctx.font = 'bold ' + Math.round(58 * s) + 'px monospace';
    ctx.fillText('CRASHED!', width / 2, height / 2 - 46 * s);

    ctx.shadowBlur = 10 * s;
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(20 * s) + 'px monospace';
    ctx.fillText('SCORE  ' + Math.floor(score), width / 2, height / 2 + 16 * s);

    ctx.fillStyle = '#9fe8ff';
    ctx.font = 'bold ' + Math.round(22 * s) + 'px monospace';
    ctx.fillText('PRESS  SPACE  TO RESTART', width / 2, height / 2 + 66 * s);

    ctx.restore();
  }
}

/* ============================================================
   输入
   ============================================================ */
function restart() {
  position = 0;
  playerX = 0;
  speed = 0;
  score = 0;
  crashed = false;
  resetCars();
}

document.addEventListener('keydown', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
  else if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    if (crashed) restart();
  }
});

document.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
});

/* ============================================================
   启动
   ============================================================ */
resize();
buildTrack();
resetCars();

let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (!crashed) update(dt);
  render();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

})();
</script>
