<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪3D公路赛车 - OutRun风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 100, 255, 0.2), 0 0 120px rgba(0, 50, 150, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // 画布大小
            let W = canvas.width = window.innerWidth;
            let H = canvas.height = window.innerHeight;
            let CX = W / 2;
            let CY = H * 0.5;
            let HORIZON = H * 0.38;

            window.addEventListener('resize', () => {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                CX = W / 2;
                CY = H * 0.5;
                HORIZON = H * 0.38;
            });

            // 游戏常量
            const SEG_LEN = 200;
            const TOTAL_SEGMENTS = 1600;
            const VISIBLE_SEGMENTS = 50;
            const CAMERA_HEIGHT = 1100;
            const CAMERA_DEPTH = 0.84;
            const ROAD_WIDTH = 2100;
            const PLAYER_Z_OFFSET = 4;
            const FOG_DENSITY = 12;

            // 游戏状态
            const STATE_PLAYING = 0;
            const STATE_CRASHED = 1;
            const STATE_GAMEOVER = 2;
            let gameState = STATE_PLAYING;

            // 玩家属性
            let playerX = 0;
            let playerZ = 0;
            let speed = 0;
            const MAX_SPEED = 260;
            const ACCELERATION = 3.5;
            const BRAKE_DECEL = 5.0;
            const NATURAL_DECEL = 1.2;
            const STEER_SPEED = 2.8;
            const CENTRIFUGAL_FORCE = 0.32;

            // 分数
            let score = 0;
            let distanceDriven = 0;

            // 道路数据
            let roadCurve = [];
            let roadHill = [];
            let roadScenery = [];

            // 对向车辆
            let oncomingCars = [];
            const MAX_ONCOMING = 8;

            // 碰撞特效
            let crashTimer = 0;
            let crashParticles = [];

            // 输入状态
            const keys = {
                left: false,
                right: false,
                up: false,
                down: false,
                space: false
            };

            // 初始化道路
            function initRoad() {
                roadCurve = [];
                roadHill = [];
                roadScenery = [];
                for (let i = 0; i < TOTAL_SEGMENTS; i++) {
                    // 使用多个正弦波叠加创建平滑曲线
                    let curve =
                        Math.sin(i * 0.008) * 1.6 +
                        Math.sin(i * 0.023 + 1.3) * 0.9 +
                        Math.sin(i * 0.005 + 0.7) * 1.2 +
                        Math.sin(i * 0.0015) * 0.5;
                    curve *= 0.55;

                    // 坡度
                    let hill =
                        Math.sin(i * 0.006 + 0.3) * 1.2 +
                        Math.sin(i * 0.014 + 2.1) * 0.7 +
                        Math.sin(i * 0.003) * 0.4;
                    hill *= 0.45;

                    roadCurve.push(curve);
                    roadHill.push(hill);
                    roadScenery.push(null);
                }

                // 生成路边景物
                for (let i = 0; i < TOTAL_SEGMENTS; i += 2) {
                    if (i % 6 === 0 || i % 7 === 0 || i % 11 === 0) {
                        const side = (i % 14 < 7) ? 1 : -1;
                        const typeRand = Math.abs(Math.sin(i * 0.7 + 2.3));
                        let type;
                        if (typeRand > 0.75) type = 'building';
                        else if (typeRand > 0.35) type = 'tree';
                        else type = 'pole';
                        const offset = 0.6 + Math.abs(Math.sin(i * 0.31)) * 2.2;
                        roadScenery[i] = {
                            side: side,
                            type: type,
                            offset: offset,
                            color: `hsl(${Math.floor(Math.abs(Math.sin(i*0.53))*360)}, 55%, 50%)`
                        };
                    }
                }
            }

            // 初始化对向车辆
            function initOncomingCars() {
                oncomingCars = [];
                for (let i = 0; i < MAX_ONCOMING; i++) {
                    oncomingCars.push(createOncomingCar());
                }
            }

            function createOncomingCar() {
                const lanePos = -0.55 + (Math.random() * 0.25 - 0.12);
                const colorHue = Math.floor(Math.random() * 360);
                return {
                    zOffset: 20 + Math.random() * 60,
                    lanePos: lanePos,
                    speed: 40 + Math.random() * 80,
                    color: `hsl(${colorHue}, 70%, 55%)`,
                    width: 0.25,
                    height: 0.12,
                    active: true,
                    wobble: Math.random() * 0.03 - 0.015
                };
            }

            function resetGame() {
                playerX = 0;
                playerZ = 0;
                speed = 0;
                score = 0;
                distanceDriven = 0;
                gameState = STATE_PLAYING;
                crashTimer = 0;
                crashParticles = [];
                initOncomingCars();
            }

            // 输入处理
            window.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        keys.left = true;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        keys.right = true;
                        e.preventDefault();
                        break;
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        keys.up = true;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        keys.down = true;
                        e.preventDefault();
                        break;
                    case ' ':
                        keys.space = true;
                        e.preventDefault();
                        if (gameState === STATE_CRASHED || gameState === STATE_GAMEOVER) {
                            resetGame();
                        }
                        break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.key) {
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        keys.left = false;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        keys.right = false;
                        e.preventDefault();
                        break;
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        keys.up = false;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        keys.down = false;
                        e.preventDefault();
                        break;
                    case ' ':
                        keys.space = false;
                        e.preventDefault();
                        break;
                }
            });

            // 更新游戏
            function update(dt) {
                if (gameState === STATE_PLAYING) {
                    // 加速/减速
                    if (keys.up) {
                        speed += ACCELERATION * dt * 60;
                    }
                    if (keys.down) {
                        speed -= BRAKE_DECEL * dt * 60;
                    }
                    speed -= NATURAL_DECEL * dt * 60 * 0.3;
                    speed = Math.max(0, Math.min(MAX_SPEED, speed));

                    // 转向
                    if (keys.left) {
                        playerX -= STEER_SPEED * dt * (0.5 + speed / MAX_SPEED * 0.7);
                    }
                    if (keys.right) {
                        playerX += STEER_SPEED * dt * (0.5 + speed / MAX_SPEED * 0.7);
                    }

                    // 道路曲率对玩家的影响（离心力）
                    const segIndex = Math.floor(playerZ) % TOTAL_SEGMENTS;
                    const curveVal = roadCurve[segIndex] || 0;
                    playerX += curveVal * CENTRIFUGAL_FORCE * dt * (speed / MAX_SPEED) * 1.5;

                    // 限制玩家位置
                    playerX = Math.max(-0.85, Math.min(0.85, playerX));

                    // 移动到路边则减速
                    if (Math.abs(playerX) > 0.8) {
                        speed *= 0.97;
                    }

                    // 更新位置
                    const moveAmount = speed * dt * 1.8;
                    playerZ += moveAmount;
                    distanceDriven += moveAmount;

                    // 计分
                    score += moveAmount * (0.1 + speed / MAX_SPEED * 0.3);

                    // 更新对向车辆
                    updateOncomingCars(dt);

                    // 碰撞检测
                    checkCollisions();

                    // 检查对向车辆是否太远（重新生成）
                    for (let i = 0; i < oncomingCars.length; i++) {
                        if (oncomingCars[i].zOffset > 100) {
                            oncomingCars[i] = createOncomingCar();
                            oncomingCars[i].zOffset = 15 + Math.random() * 20;
                        }
                    }
                } else if (gameState === STATE_CRASHED) {
                    crashTimer -= dt;
                    updateCrashParticles(dt);
                    if (crashTimer <= 0) {
                        gameState = STATE_GAMEOVER;
                    }
                }
            }

            function updateOncomingCars(dt) {
                for (let i = 0; i < oncomingCars.length; i++) {
                    const car = oncomingCars[i];
                    car.zOffset -= (car.speed + speed * 0.25) * dt * 0.08;
                    car.lanePos += car.wobble * dt * 2;
                    if (car.zOffset < 2) {
                        car.zOffset = 25 + Math.random() * 45;
                        car.lanePos = -0.55 + (Math.random() * 0.25 - 0.12);
                    }
                }
            }

            function checkCollisions() {
                for (let i = 0; i < oncomingCars.length; i++) {
                    const car = oncomingCars[i];
                    if (car.zOffset > 2 && car.zOffset < 6) {
                        const xDist = Math.abs(playerX - car.lanePos);
                        if (xDist < 0.28) {
                            triggerCrash();
                            return;
                        }
                    }
                }
                // 撞到路边
                if (Math.abs(playerX) > 0.92) {
                    triggerCrash();
                }
            }

            function triggerCrash() {
                gameState = STATE_CRASHED;
                crashTimer = 1.8;
                crashParticles = [];
                for (let i = 0; i < 40; i++) {
                    crashParticles.push({
                        x: playerX,
                        y: 0.3,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: (Math.random() - 0.5) * 2.5,
                        life: 1.0 + Math.random() * 0.5,
                        color: `hsl(${Math.random()*60 + 10}, 90%, 60%)`,
                        size: 2 + Math.random() * 6
                    });
                }
                speed = 0;
            }

            function updateCrashParticles(dt) {
                for (let i = crashParticles.length - 1; i >= 0; i--) {
                    const p = crashParticles[i];
                    p.life -= dt * 1.5;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 5 * dt;
                    if (p.life <= 0) {
                        crashParticles.splice(i, 1);
                    }
                }
            }

            // 绘制函数
            function drawSky() {
                const gradient = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
                gradient.addColorStop(0, '#0a1a4a');
                gradient.addColorStop(0.3, '#1a3a7a');
                gradient.addColorStop(0.6, '#4a8abc');
                gradient.addColorStop(0.85, '#8ec8e8');
                gradient.addColorStop(1, '#c8e8f0');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, W, HORIZON + 40);

                // 太阳
                const sunX = W * 0.78;
                const sunY = HORIZON * 0.45;
                const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
                sunGrad.addColorStop(0, 'rgba(255,255,220,1)');
                sunGrad.addColorStop(0.2, 'rgba(255,240,180,0.9)');
                sunGrad.addColorStop(0.5, 'rgba(255,200,100,0.4)');
                sunGrad.addColorStop(1, 'rgba(255,180,80,0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fffee8';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 22, 0, Math.PI * 2);
                ctx.fill();

                // 云
                drawCloud(W * 0.2, HORIZON * 0.25, 1.2);
                drawCloud(W * 0.45, HORIZON * 0.18, 1.5);
                drawCloud(W * 0.62, HORIZON * 0.3, 0.9);
                drawCloud(W * 0.85, HORIZON * 0.2, 1.1);
            }

            function drawCloud(x, y, scale) {
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.beginPath();
                ctx.arc(x, y, 28 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30 * scale, y - 12 * scale, 34 * scale, 0, Math.PI * 2);
                ctx.arc(x + 62 * scale, y, 26 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30 * scale, y + 8 * scale, 30 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawMountains() {
                ctx.fillStyle = '#2a3a5a';
                ctx.beginPath();
                ctx.moveTo(0, HORIZON);
                for (let x = 0; x <= W; x += 4) {
                    const t = x / W;
                    const mountH = Math.sin(t * 3.1 + 0.5) * 35 + Math.sin(t * 7.7 + 2.3) * 22 + Math.sin(t * 12.3 + 1.1) *
                        10;
                    ctx.lineTo(x, HORIZON - mountH - 15);
                }
                ctx.lineTo(W, HORIZON);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#3a4a6a';
                ctx.beginPath();
                ctx.moveTo(0, HORIZON);
                for (let x = 0; x <= W; x += 4) {
                    const t = x / W;
                    const mountH = Math.sin(t * 4.3 + 2.1) * 28 + Math.sin(t * 9.1 + 0.8) * 18;
                    ctx.lineTo(x, HORIZON - mountH - 5);
                }
                ctx.lineTo(W, HORIZON);
                ctx.closePath();
                ctx.fill();
            }

            function drawRoadSegment(segIndex, camX, camY, camZ, projScale, segData) {
                const z1 = (segIndex - camZ) * SEG_LEN;
                const z2 = (segIndex + 1 - camZ) * SEG_LEN;
                if (z1 <= 5) return null;

                const scale1 = projScale / z1;
                const scale2 = projScale / z2;

                const curveOffset1 = segData.curveOffset || 0;
                const curveOffset2 = segData.curveOffsetNext || 0;
                const hill1 = segData.hill1 || 0;
                const hill2 = segData.hill2 || 0;

                const y1 = HORIZON + (CAMERA_HEIGHT - hill1) * scale1;
                const y2 = HORIZON + (CAMERA_HEIGHT - hill2) * scale2;

                const roadW1 = ROAD_WIDTH * scale1;
                const roadW2 = ROAD_WIDTH * scale2;

                const centerX1 = CX + (curveOffset1 - camX) * scale1;
                const centerX2 = CX + (curveOffset2 - camX) * scale2;

                return {
                    x1: centerX1 - roadW1,
                    x2: centerX1 + roadW1,
                    y1: y1,
                    x3: centerX2 - roadW2,
                    x4: centerX2 + roadW2,
                    y2: y2,
                    z1: z1,
                    z2: z2,
                    scale1: scale1,
                    scale2: scale2,
                    centerX1: centerX1,
                    centerX2: centerX2,
                    roadW1: roadW1,
                    roadW2: roadW2
                };
            }

            function drawFullGame() {
                ctx.clearRect(0, 0, W, H);

                drawSky();
                drawMountains();

                // 计算可见段
                const startSeg = Math.floor(playerZ);
                const endSeg = startSeg + VISIBLE_SEGMENTS;

                // 预计算曲线和高度偏移
                let curveOffset = 0;
                let curveOffsetNext = 0;
                let hillVal = 0;
                let hillValNext = 0;
                const curveOffsets = [];
                const hillVals = [];

                for (let i = startSeg; i <= endSeg + 1; i++) {
                    const idx = ((i % TOTAL_SEGMENTS) + TOTAL_SEGMENTS) % TOTAL_SEGMENTS;
                    curveOffsets.push(curveOffset);
                    hillVals.push(hillVal);
                    curveOffset += (roadCurve[idx] || 0) * 0.9;
                    hillVal += (roadHill[idx] || 0) * 120;
                }

                const projScale = W * CAMERA_DEPTH;

                // 从远到近渲染道路
                for (let i = endSeg; i >= startSeg; i--) {
                    const idx = ((i % TOTAL_SEGMENTS) + TOTAL_SEGMENTS) % TOTAL_SEGMENTS;
                    const localIdx = i - startSeg;

                    const z1 = (i - playerZ) * SEG_LEN;
                    const z2 = (i + 1 - playerZ) * SEG_LEN;
                    if (z1 <= 3) continue;

                    const scale1 = projScale / z1;
                    const scale2 = projScale / z2;

                    const cOff1 = curveOffsets[localIdx];
                    const cOff2 = curveOffsets[localIdx + 1];
                    const h1 = hillVals[localIdx];
                    const h2 = hillVals[localIdx + 1];

                    const y1 = HORIZON + (CAMERA_HEIGHT - h1) * scale1;
                    const y2 = HORIZON + (CAMERA_HEIGHT - h2) * scale2;

                    const roadW1 = ROAD_WIDTH * scale1;
                    const roadW2 = ROAD_WIDTH * scale2;

                    const centerX1 = CX + (cOff1 - playerX * ROAD_WIDTH * 0.6) * scale1;
                    const centerX2 = CX + (cOff2 - playerX * ROAD_WIDTH * 0.6) * scale2;

                    const x1 = centerX1 - roadW1;
                    const x2 = centerX1 + roadW1;
                    const x3 = centerX2 - roadW2;
                    const x4 = centerX2 + roadW2;

                    // 雾效
                    const fogFactor = Math.min(1, Math.max(0, (z1 - 100) / 4800));
                    const fogColor = [200, 220, 235];

                    // 草地
                    const grassColor = lerpColor([40, 90, 50], fogColor, fogFactor);
                    ctx.fillStyle = `rgb(${grassColor[0]},${grassColor[1]},${grassColor[2]})`;
                    ctx.fillRect(0, y2, W, y1 - y2);

                    // 道路主体
                    const roadColor = lerpColor([72, 72, 76], fogColor, fogFactor);
                    ctx.fillStyle = `rgb(${roadColor[0]},${roadColor[1]},${roadColor[2]})`;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y1);
                    ctx.lineTo(x4, y2);
                    ctx.lineTo(x3, y2);
                    ctx.closePath();
                    ctx.fill();

                    // 路肩（红白条纹）
                    const shoulderW1 = roadW1 * 0.08;
                    const shoulderW2 = roadW2 * 0.08;
                    const isRedStriped = (i % 4 < 2);
                    const shoulderColor = isRedStriped ? [218, 58, 50] : [235, 235, 235];
                    const shoulderCol = lerpColor(shoulderColor, fogColor, fogFactor);

                    // 左路肩
                    ctx.fillStyle = `rgb(${shoulderCol[0]},${shoulderCol[1]},${shoulderCol[2]})`;
                    ctx.beginPath();
                    ctx.moveTo(x1 - 0.5, y1);
                    ctx.lineTo(x1 + shoulderW1, y1);
                    ctx.lineTo(x3 + shoulderW2, y2);
                    ctx.lineTo(x3 - 0.5, y2);
                    ctx.closePath();
                    ctx.fill();

                    // 右路肩
                    ctx.fillStyle = `rgb(${shoulderCol[0]},${shoulderCol[1]},${shoulderCol[2]})`;
                    ctx.beginPath();
                    ctx.moveTo(x2 - shoulderW1, y1);
                    ctx.lineTo(x2 + 0.5, y1);
                    ctx.lineTo(x4 + 0.5, y2);
                    ctx.lineTo(x4 - shoulderW2, y2);
                    ctx.closePath();
                    ctx.fill();

                    // 中央虚线
                    if (i % 3 === 0 || i % 3 === 1) {
                        const dashW1 = roadW1 * 0.02;
                        const dashW2 = roadW2 * 0.02;
                        const dashCol = lerpColor([255, 255, 255], fogColor, fogFactor);
                        ctx.fillStyle =
                            `rgba(${dashCol[0]},${dashCol[1]},${dashCol[2]},${1 - fogFactor * 0.7})`;
                        ctx.beginPath();
                        ctx.moveTo(centerX1 - dashW1, y1);
                        ctx.lineTo(centerX1 + dashW1, y1);
                        ctx.lineTo(centerX2 + dashW2, y2);
                        ctx.lineTo(centerX2 - dashW2, y2);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // 路边景物
                    const scenery = roadScenery[idx];
                    if (scenery && z1 > 30 && z1 < 3500) {
                        drawScenery(scenery, centerX1, centerX2, roadW1, roadW2, y1, y2, scale1, scale2, fogFactor, i);
                    }
                }

                // 绘制对向车辆
                drawOncomingCars(startSeg, endSeg, curveOffsets, hillVals, projScale);

                // 绘制玩家车辆
                drawPlayerCar();

                // 绘制HUD
                drawHUD();

                // 碰撞特效
                if (gameState === STATE_CRASHED || gameState === STATE_GAMEOVER) {
                    drawCrashEffects();
                }
            }

            function drawScenery(scenery, cx1, cx2, rw1, rw2, y1, y2, sc1, sc2, fog, segIdx) {
                const side = scenery.side;
                const offset = scenery.offset;
                const type = scenery.type;
                const color = scenery.color;
                const roadEdge1 = side * (rw1 * (1 + offset * 0.35));
                const roadEdge2 = side * (rw2 * (1 + offset * 0.35));
                const sx1 = cx1 + roadEdge1;
                const sx2 = cx2 + roadEdge2;
                const baseY1 = y1;
                const baseY2 = y2;

                const alpha = 1 - fog * 0.85;
                if (alpha <= 0.02) return;
                ctx.globalAlpha = alpha;

                if (type === 'tree') {
                    const trunkH1 = sc1 * 70;
                    const trunkH2 = sc2 * 70;
                    const trunkW1 = sc1 * 18;
                    const trunkW2 = sc2 * 18;
                    ctx.fillStyle = '#5a3a20';
                    ctx.fillRect(sx1 - trunkW1 / 2, baseY1 - trunkH1, trunkW1, trunkH1);
                    ctx.fillRect(sx2 - trunkW2 / 2, baseY2 - trunkH2, trunkW2, trunkH2);
                    const crownR1 = sc1 * 110;
                    const crownR2 = sc2 * 110;
                    ctx.fillStyle = '#2a6a30';
                    ctx.beginPath();
                    ctx.arc(sx1, baseY1 - trunkH1 - crownR1 / 2, crownR1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#357a3a';
                    ctx.beginPath();
                    ctx.arc(sx2, baseY2 - trunkH2 - crownR2 / 2, crownR2, 0, Math.PI * 2);
                    ctx.fill();
                    // 树冠高光
                    ctx.fillStyle = 'rgba(100,180,100,0.35)';
                    ctx.beginPath();
                    ctx.arc(sx1 - crownR1 * 0.2, baseY1 - trunkH1 - crownR1 * 0.65, crownR1 * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                } else if (type === 'building') {
                    const bH1 = sc1 * 200 + 40;
                    const bH2 = sc2 * 200 + 40;
                    const bW1 = sc1 * 140 + 30;
                    const bW2 = sc2 * 140 + 30;
                    ctx.fillStyle = color;
                    ctx.fillRect(sx1 - bW1 / 2, baseY1 - bH1, bW1, bH1);
                    ctx.fillRect(sx2 - bW2 / 2, baseY2 - bH2, bW2, bH2);
                    // 窗户
                    const winCol = 'rgba(255,255,200,0.7)';
                    const winRows = 4;
                    const winCols = 3;
                    for (let r = 0; r < winRows; r++) {
                        for (let c = 0; c < winCols; c++) {
                            const wx1 = sx1 - bW1 / 2 + bW1 * (0.15 + c * 0.25);
                            const wy1 = baseY1 - bH1 + bH1 * (0.15 + r * 0.2);
                            const ww1 = bW1 * 0.12;
                            const wh1 = bH1 * 0.08;
                            ctx.fillStyle = winCol;
                            ctx.fillRect(wx1, wy1, ww1, wh1);
                            const wx2 = sx2 - bW2 / 2 + bW2 * (0.15 + c * 0.25);
                            const wy2 = baseY2 - bH2 + bH2 * (0.15 + r * 0.2);
                            const ww2 = bW2 * 0.12;
                            const wh2 = bH2 * 0.08;
                            ctx.fillStyle = winCol;
                            ctx.fillRect(wx2, wy2, ww2, wh2);
                        }
                    }
                } else {
                    // 灯柱
                    const pH1 = sc1 * 140;
                    const pH2 = sc2 * 140;
                    const pW1 = sc1 * 10;
                    const pW2 = sc2 * 10;
                    ctx.fillStyle = '#666';
                    ctx.fillRect(sx1 - pW1 / 2, baseY1 - pH1, pW1, pH1);
                    ctx.fillRect(sx2 - pW2 / 2, baseY2 - pH2, pW2, pH2);
                    ctx.fillStyle = '#ffdd66';
                    ctx.beginPath();
                    ctx.arc(sx1, baseY1 - pH1, sc1 * 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sx2, baseY2 - pH2, sc2 * 22, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawOncomingCars(startSeg, endSeg, curveOffsets, hillVals, projScale) {
                for (let i = 0; i < oncomingCars.length; i++) {
                    const car = oncomingCars[i];
                    const carZ = playerZ + car.zOffset;
                    if (carZ < startSeg || carZ > endSeg) continue;
                    const localIdx = Math.floor(carZ) - startSeg;
                    if (localIdx < 0 || localIdx >= curveOffsets.length - 1) continue;

                    const z1 = (carZ - playerZ) * SEG_LEN;
                    const z2 = (carZ + 0.8 - playerZ) * SEG_LEN;
                    if (z1 <= 3) continue;

                    const scale1 = projScale / z1;
                    const scale2 = projScale / z2;

                    const cOff1 = curveOffsets[localIdx];
                    const cOff2 = curveOffsets[Math.min(localIdx + 1, curveOffsets.length - 1)];
                    const h1 = hillVals[localIdx];
                    const h2 = hillVals[Math.min(localIdx + 1, hillVals.length - 1)];

                    const y1 = HORIZON + (CAMERA_HEIGHT - h1) * scale1;
                    const y2 = HORIZON + (CAMERA_HEIGHT - h2) * scale2;

                    const centerX1 = CX + (cOff1 - car.lanePos * ROAD_WIDTH * 0.6) * scale1;
                    const centerX2 = CX + (cOff2 - car.lanePos * ROAD_WIDTH * 0.6) * scale2;

                    const carW1 = ROAD_WIDTH * 0.19 * scale1;
                    const carW2 = ROAD_WIDTH * 0.19 * scale2;
                    const carH1 = ROAD_WIDTH * 0.16 * scale1;
                    const carH2 = ROAD_WIDTH * 0.16 * scale2;

                    const fog = Math.min(1, Math.max(0, (z1 - 100) / 4800));
                    if (fog > 0.85) continue;
                    const alpha = 1 - fog;

                    ctx.globalAlpha = alpha;
                    // 车身
                    ctx.fillStyle = car.color;
                    ctx.beginPath();
                    ctx.moveTo(centerX1 - carW1 / 2, y1 - carH1);
                    ctx.lineTo(centerX1 + carW1 / 2, y1 - carH1);
                    ctx.lineTo(centerX2 + carW2 / 2, y2 - carH2);
                    ctx.lineTo(centerX2 - carW2 / 2, y2 - carH2);
                    ctx.closePath();
                    ctx.fill();
                    // 车窗
                    ctx.fillStyle = 'rgba(180,210,235,0.85)';
                    ctx.beginPath();
                    ctx.moveTo(centerX1 - carW1 * 0.4, y1 - carH1 * 0.85);
                    ctx.lineTo(centerX1 + carW1 * 0.4, y1 - carH1 * 0.85);
                    ctx.lineTo(centerX2 + carW2 * 0.4, y2 - carH2 * 0.85);
                    ctx.lineTo(centerX2 - carW2 * 0.4, y2 - carH2 * 0.85);
                    ctx.closePath();
                    ctx.fill();
                    // 前灯
                    ctx.fillStyle = 'rgba(255,255,200,0.9)';
                    ctx.fillRect(centerX1 - carW1 * 0.35, y1 - carH1 * 0.25, carW1 * 0.25, carH1 * 0.2);
                    ctx.fillRect(centerX1 + carW1 * 0.1, y1 - carH1 * 0.25, carW1 * 0.25, carH1 * 0.2);
                    ctx.globalAlpha = 1;
                }
            }

            function drawPlayerCar() {
                const carY = H * 0.82;
                const carW = W * 0.075;
                const carH = carW * 1.35;
                const carX = CX - carW / 2;

                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(CX, carY + carH * 0.38, carW * 0.65, carH * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // 车身
                const bodyGrad = ctx.createLinearGradient(carX, carY, carX, carY + carH);
                bodyGrad.addColorStop(0, '#e84444');
                bodyGrad.addColorStop(0.45, '#c03030');
                bodyGrad.addColorStop(0.55, '#a02020');
                bodyGrad.addColorStop(1, '#801818');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(carX + carW * 0.15, carY);
                ctx.lineTo(carX + carW * 0.85, carY);
                ctx.lineTo(carX + carW * 0.95, carY + carH * 0.5);
                ctx.lineTo(carX + carW, carY + carH * 0.82);
                ctx.lineTo(carX + carW * 0.92, carY + carH);
                ctx.lineTo(carX + carW * 0.08, carY + carH);
                ctx.lineTo(carX, carY + carH * 0.82);
                ctx.lineTo(carX + carW * 0.05, carY + carH * 0.5);
                ctx.closePath();
                ctx.fill();

                // 车窗
                ctx.fillStyle = '#1a2a4a';
                ctx.beginPath();
                ctx.moveTo(carX + carW * 0.22, carY + carH * 0.08);
                ctx.lineTo(carX + carW * 0.78, carY + carH * 0.08);
                ctx.lineTo(carX + carW * 0.85, carY + carH * 0.38);
                ctx.lineTo(carX + carW * 0.15, carY + carH * 0.38);
                ctx.closePath();
                ctx.fill();

                // 车窗反光
                ctx.fillStyle = 'rgba(120,160,200,0.3)';
                ctx.beginPath();
                ctx.moveTo(carX + carW * 0.35, carY + carH * 0.1);
                ctx.lineTo(carX + carW * 0.5, carY + carH * 0.1);
                ctx.lineTo(carX + carW * 0.52, carY + carH * 0.34);
                ctx.lineTo(carX + carW * 0.37, carY + carH * 0.34);
                ctx.closePath();
                ctx.fill();

                // 后灯
                ctx.fillStyle = '#ff3030';
                ctx.beginPath();
                ctx.arc(carX + carW * 0.1, carY + carH * 0.8, carW * 0.12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(carX + carW * 0.9, carY + carH * 0.8, carW * 0.12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff8080';
                ctx.beginPath();
                ctx.arc(carX + carW * 0.1, carY + carH * 0.8, carW * 0.06, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(carX + carW * 0.9, carY + carH * 0.8, carW * 0.06, 0, Math.PI * 2);
                ctx.fill();

                // 排气管
                ctx.fillStyle = '#555';
                ctx.fillRect(carX + carW * 0.35, carY + carH * 0.92, carW * 0.12, carH * 0.06);
                ctx.fillRect(carX + carW * 0.53, carY + carH * 0.92, carW * 0.12, carH * 0.06);

                // 尾气效果
                if (speed > 30 && gameState === STATE_PLAYING) {
                    ctx.fillStyle = 'rgba(180,180,180,0.25)';
                    for (let e = 0; e < 4; e++) {
                        const ex = carX + carW * (0.3 + e * 0.18) + Math.random() * 4;
                        const ey = carY + carH * 1.05 + Math.random() * 8;
                        const er = 5 + Math.random() * 8 + speed * 0.03;
                        ctx.beginPath();
                        ctx.arc(ex, ey, er, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawHUD() {
                // 半透明面板
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.roundRect(W - 180, 20, 160, 130, 16);
                ctx.fill();

                // 速度表外框
                const dialCX = W - 100;
                const dialCY = 85;
                const dialR = 50;

                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(dialCX, dialCY, dialR, 0, Math.PI * 2);
                ctx.stroke();

                // 刻度
                for (let i = 0; i <= 12; i++) {
                    const angle = -Math.PI * 0.75 + (i / 12) * Math.PI * 1.5;
                    const innerR = dialR - 7;
                    const outerR = dialR - 2;
                    const isMajor = i % 3 === 0;
                    const tickInner = isMajor ? dialR - 11 : dialR - 7;
                    ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.4)';
                    ctx.lineWidth = isMajor ? 2.5 : 1.5;
                    ctx.beginPath();
                    ctx.moveTo(dialCX + Math.cos(angle) * tickInner, dialCY + Math.sin(angle) * tickInner);
                    ctx.lineTo(dialCX + Math.cos(angle) * outerR, dialCY + Math.sin(angle) * outerR);
                    ctx.stroke();
                }

                // 速度指针
                const speedRatio = speed / MAX_SPEED;
                const needleAngle = -Math.PI * 0.75 + speedRatio * Math.PI * 1.5;
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(dialCX, dialCY);
                ctx.lineTo(dialCX + Math.cos(needleAngle) * (dialR - 16), dialCY + Math.sin(needleAngle) * (dialR -
                    16));
                ctx.stroke();
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(dialCX, dialCY, 4, 0, Math.PI * 2);
                ctx.fill();

                // 速度数字
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px "Segoe UI",Arial,sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(Math.floor(speed) + '', dialCX, dialCY + dialR + 22);
                ctx.font = '10px "Segoe UI",Arial,sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fillText('km/h', dialCX, dialCY + dialR + 36);

                // 分数
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.roundRect(20, 20, 180, 50, 16);
                ctx.fill();
                ctx.fillStyle = '#ffcc44';
                ctx.font = 'bold 14px "Segoe UI",Arial,sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('SCORE', 34, 43);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px "Segoe UI",Arial,sans-serif';
                ctx.fillText(Math.floor(score).toLocaleString(), 34, 66);

                // 距离
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.roundRect(20, 80, 180, 36, 16);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.font = '12px "Segoe UI",Arial,sans-serif';
                ctx.fillText('DISTANCE', 34, 98);
                ctx.fillStyle = '#8ec8e8';
                ctx.font = 'bold 16px "Segoe UI",Arial,sans-serif';
                ctx.fillText(Math.floor(distanceDriven / 10) + ' m', 34, 114);

                // 操作提示
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '11px "Segoe UI",Arial,sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('← → 转向 | ↑ 加速 | ↓ 减速', 20, H - 22);
            }

            function drawCrashEffects() {
                // 暗色覆盖
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, W, H);

                // 粒子
                for (let i = 0; i < crashParticles.length; i++) {
                    const p = crashParticles[i];
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    const px = CX + p.x * ROAD_WIDTH * 0.5;
                    const py = H * 0.75 + p.y * 60;
                    ctx.fillRect(px, py, p.size, p.size);
                }
                ctx.globalAlpha = 1;

                // 碰撞文字
                ctx.textAlign = 'center';
                const shakeX = (Math.random() - 0.5) * 6 * (crashTimer > 0 ? 1 : 0);
                const shakeY = (Math.random() - 0.5) * 4 * (crashTimer > 0 ? 1 : 0);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 48px "Segoe UI",Arial,sans-serif';
                ctx.fillText('碰撞!', CX + shakeX, H * 0.35 + shakeY);

                if (gameState === STATE_GAMEOVER) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px "Segoe UI",Arial,sans-serif';
                    ctx.fillText('按 空格键 重新开始', CX, H * 0.48);
                    ctx.fillStyle = 'rgba(255,200,50,0.9)';
                    ctx.font = '14px "Segoe UI",Arial,sans-serif';
                    ctx.fillText('最终得分: ' + Math.floor(score).toLocaleString(), CX, H * 0.55);
                }
            }

            function lerpColor(c1, c2, t) {
                return [
                    Math.round(c1[0] + (c2[0] - c1[0]) * t),
                    Math.round(c1[1] + (c2[1] - c1[1]) * t),
                    Math.round(c1[2] + (c2[2] - c1[2]) * t)
                ];
            }

            // 游戏循环
            let lastTime = 0;

            function gameLoop(timestamp) {
                const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.05) : 0.016;
                lastTime = timestamp;

                update(dt);
                drawFullGame();

                requestAnimationFrame(gameLoop);
            }

            // 初始化
            initRoad();
            initOncomingCars();

            // 添加roundRect方法
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    this.beginPath();
                    this.moveTo(x + r.tl, y);
                    this.lineTo(x + w - r.tr, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    this.lineTo(x + w, y + h - r.br);
                    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    this.lineTo(x + r.bl, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    this.lineTo(x, y + r.tl);
                    this.quadraticCurveTo(x, y, x + r.tl, y);
                    this.closePath();
                    return this;
                };
            }

            // 启动游戏
            requestAnimationFrame(gameLoop);
        })();
    </script>
