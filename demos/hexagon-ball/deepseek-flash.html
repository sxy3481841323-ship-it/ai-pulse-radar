<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball in a Spinning Hexagon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b0f1a;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const center = { x: 0, y: 0 };
  const hex = { R: 0, angle: 0 };
  const ball = {
    pos: { x: 0, y: 0 },
    vel: { x: 0, y: 0 },
    radius: 10
  };

  const omega = 0.8;          // Hexagon angular velocity (rad/s)
  const restitution = 0.82;   // Bounciness
  const wallFriction = 0.4;   // Tangential friction coefficient
  const airDrag = 0.12;       // Air drag per second

  let lastTime = performance.now();
  let accumulator = 0;
  const fixedDt = 1 / 240;
  const maxFrameDt = 0.05;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const prevCenterX = center.x;
    const prevCenterY = center.y;
    const prevR = hex.R;

    center.x = w * 0.5;
    center.y = h * 0.5;
    hex.R = Math.min(w, h) * 0.36;

    if (prevR > 0) {
      const scale = hex.R / prevR;
      ball.pos.x = center.x + (ball.pos.x - prevCenterX) * scale;
      ball.pos.y = center.y + (ball.pos.y - prevCenterY) * scale;
    } else {
      ball.pos.x = center.x;
      ball.pos.y = center.y - hex.R * 0.25;
    }
    ball.radius = hex.R * 0.075;
  }

  function getHexGeometry(angle) {
    const verts = [];
    for (let i = 0; i < 6; i++) {
      const a = angle + i * Math.PI / 3;
      verts.push({
        x: center.x + hex.R * Math.cos(a),
        y: center.y + hex.R * Math.sin(a)
      });
    }

    const edges = [];
    for (let i = 0; i < 6; i++) {
      const A = verts[i];
      const B = verts[(i + 1) % 6];
      let nx = -(B.y - A.y);
      let ny = (B.x - A.x);
      const len = Math.hypot(nx, ny);
      nx /= len;
      ny /= len;

      // Make the normal point inward toward the center.
      const mx = (A.x + B.x) * 0.5;
      const my = (A.y + B.y) * 0.5;
      if ((center.x - mx) * nx + (center.y - my) * ny < 0) {
        nx = -nx;
        ny = -ny;
      }

      edges.push({ A, B, n: { x: nx, y: ny } });
    }

    return { verts, edges, center: { x: center.x, y: center.y } };
  }

  function closestPointOnSegment(p, a, b) {
    const abx = b.x - a.x;
    const aby = b.y - a.y;
    const apx = p.x - a.x;
    const apy = p.y - a.y;
    const lenSq = abx * abx + aby * aby;
    let t = lenSq > 0 ? (apx * abx + apy * aby) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: a.x + abx * t, y: a.y + aby * t };
  }

  function step(dt) {
    hex.angle += omega * dt;
    const geom = getHexGeometry(hex.angle);
    const R = hex.R;

    // Gravity.
    const gravity = R * 3.8;
    ball.vel.y += gravity * dt;

    // Air drag.
    const drag = Math.exp(-airDrag * dt);
    ball.vel.x *= drag;
    ball.vel.y *= drag;

    // Speed limit for stability.
    const maxSpeed = R * 14;
    let speed = Math.hypot(ball.vel.x, ball.vel.y);
    if (speed > maxSpeed) {
      const s = maxSpeed / speed;
      ball.vel.x *= s;
      ball.vel.y *= s;
    }

    // Integrate.
    ball.pos.x += ball.vel.x * dt;
    ball.pos.y += ball.vel.y * dt;

    // Collisions against the hexagon's inward half-planes.
    const restitutionThreshold = R * 0.25;
    const slop = 0.01;

    for (let iter = 0; iter < 6; iter++) {
      let collided = false;

      for (const edge of geom.edges) {
        const n = edge.n;
        const d = (ball.pos.x - edge.A.x) * n.x +
                  (ball.pos.y - edge.A.y) * n.y;

        if (d < ball.radius) {
          collided = true;

          // Contact point on the wall before correction.
          const contact = closestPointOnSegment(ball.pos, edge.A, edge.B);

          // Move the ball fully inside the wall.
          const penetration = ball.radius - d + slop;
          ball.pos.x += n.x * penetration;
          ball.pos.y += n.y * penetration;

          // Velocity of the rotating wall at the contact point.
          const rx = contact.x - geom.center.x;
          const ry = contact.y - geom.center.y;
          const wallVx = -omega * ry;
          const wallVy = omega * rx;

          // Relative velocity.
          let relVx = ball.vel.x - wallVx;
          let relVy = ball.vel.y - wallVy;
          const vn = relVx * n.x + relVy * n.y;

          if (vn < 0) {
            // Restitution (suppress tiny bounces).
            const e = (-vn < restitutionThreshold) ? 0 : restitution;
            const jn = -(1 + e) * vn;

            // Normal impulse.
            ball.vel.x += jn * n.x;
            ball.vel.y += jn * n.y;

            // Friction impulse.
            const tx = relVx - vn * n.x;
            const ty = relVy - vn * n.y;
            const tlen = Math.hypot(tx, ty);

            if (tlen > 1e-6) {
              const maxFriction = wallFriction * jn;
              if (tlen <= maxFriction) {
                // Static friction: stop tangential sliding.
                ball.vel.x -= tx;
                ball.vel.y -= ty;
              } else {
                // Kinetic friction.
                const scale = maxFriction / tlen;
                ball.vel.x -= tx * scale;
                ball.vel.y -= ty * scale;
              }
            }
          }
        }
      }

      if (!collided) break;
    }

    // Final speed clamp after collisions.
    speed = Math.hypot(ball.vel.x, ball.vel.y);
    if (speed > maxSpeed) {
      const s = maxSpeed / speed;
      ball.vel.x *= s;
      ball.vel.y *= s;
    }
  }

  function render() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // Background.
    const bg = ctx.createRadialGradient(
      center.x, center.y, 0,
      center.x, center.y, Math.max(w, h) * 0.75
    );
    bg.addColorStop(0, '#151c2e');
    bg.addColorStop(1, '#07090f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const geom = getHexGeometry(hex.angle);

    // Hexagon.
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = '#4fc3ff';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#4fc3ff';
    ctx.lineWidth = Math.max(3, hex.R * 0.018);
    ctx.beginPath();
    ctx.moveTo(geom.verts[0].x, geom.verts[0].y);
    for (let i = 1; i < geom.verts.length; i++) {
      ctx.lineTo(geom.verts[i].x, geom.verts[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Faint inner outline.
    ctx.save();
    ctx.strokeStyle = 'rgba(79, 195, 255, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(geom.verts[0].x, geom.verts[0].y);
    for (let i = 1; i < geom.verts.length; i++) {
      ctx.lineTo(geom.verts[i].x, geom.verts[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Ball.
    const r = ball.radius;
    const grad = ctx.createRadialGradient(
      ball.pos.x - r * 0.35,
      ball.pos.y - r * 0.35,
      r * 0.1,
      ball.pos.x,
      ball.pos.y,
      r
    );
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.25, '#ffe084');
    grad.addColorStop(0.7, '#ffb020');
    grad.addColorStop(1, '#e67300');

    ctx.save();
    ctx.shadowColor = 'rgba(255, 180, 40, 0.8)';
    ctx.shadowBlur = 22;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.pos.x, ball.pos.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Highlight.
    ctx.beginPath();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.arc(ball.pos.x - r * 0.3, ball.pos.y - r * 0.35, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  function animate(now) {
    let frameDt = (now - lastTime) / 1000;
    lastTime = now;
    if (frameDt > maxFrameDt) frameDt = maxFrameDt;

    accumulator += frameDt;

    let steps = 0;
    while (accumulator >= fixedDt && steps < 40) {
      step(fixedDt);
      accumulator -= fixedDt;
      steps++;
    }
    if (steps === 40) accumulator = 0;

    render();
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
